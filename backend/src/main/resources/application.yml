spring:
  application:
    name: akis
  datasource:
    url: ${AKIS_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:akis_metadata}}
    username: ${AKIS_DB_USERNAME:${POSTGRES_USER:akis_app}}
    password: ${AKIS_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${AKIS_DB_POOL_SIZE:5}
      minimum-idle: 1
      initialization-fail-timeout: 1
  flyway:
    enabled: true
    locations: classpath:db/akis
    default-schema: akis
    schemas: akis
    create-schemas: true
    validate-migration-naming: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: akis.spring_session

server:
  address: ${AKIS_SERVER_ADDRESS:127.0.0.1}
  port: ${AKIS_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${AKIS_SESSION_COOKIE_SECURE:false}

akis:
  export:
    maintenance-enabled: ${AKIS_EXPORT_MAINTENANCE_ENABLED:true}
    maintenance-delay-ms: ${AKIS_EXPORT_MAINTENANCE_DELAY_MS:300000}
  execution:
    accept-manual-requests: ${AKIS_EXECUTION_ACCEPT_MANUAL_REQUESTS:false}
    worker-enabled: ${AKIS_EXECUTION_WORKER_ENABLED:false}
    procedure-runtime-enabled: ${AKIS_EXECUTION_PROCEDURE_RUNTIME_ENABLED:false}
    staged-runtime-enabled: ${AKIS_EXECUTION_STAGED_RUNTIME_ENABLED:false}
    recovery-runtime-enabled: ${AKIS_EXECUTION_RECOVERY_RUNTIME_ENABLED:false}
    transfer-recovery-enabled: ${AKIS_EXECUTION_TRANSFER_RECOVERY_ENABLED:false}
    staged-fault-injection: ${AKIS_EXECUTION_STAGED_FAULT_INJECTION:}
    worker-reference: ${AKIS_EXECUTION_WORKER_REFERENCE:}
    worker-profile-uuid: ${AKIS_EXECUTION_WORKER_PROFILE_UUID:}
    worker-lease-seconds: ${AKIS_EXECUTION_WORKER_LEASE_SECONDS:60}
    worker-poll-delay-ms: ${AKIS_EXECUTION_WORKER_POLL_DELAY_MS:2000}
    scheduler-enabled: ${AKIS_EXECUTION_SCHEDULER_ENABLED:false}
    schedule-poll-delay-ms: ${AKIS_EXECUTION_SCHEDULE_POLL_DELAY_MS:15000}
  security:
    mode: ${AKIS_SECURITY_MODE:local}
    data-encryption-key: ${AKIS_DATA_ENCRYPTION_KEY:}
    session:
      absolute-timeout: ${AKIS_SESSION_ABSOLUTE_TIMEOUT:8h}
    login:
      account-attempt-limit: ${AKIS_LOGIN_ACCOUNT_ATTEMPT_LIMIT:5}
      account-window: ${AKIS_LOGIN_ACCOUNT_WINDOW:15m}
      account-lock: ${AKIS_LOGIN_ACCOUNT_LOCK:15m}
      ip-attempt-limit: ${AKIS_LOGIN_IP_ATTEMPT_LIMIT:60}
      ip-window: ${AKIS_LOGIN_IP_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
