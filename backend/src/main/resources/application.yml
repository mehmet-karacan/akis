spring:
  application:
    name: akis
  datasource:
    url: ${AKIS_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:akis_metadata}}
    username: ${AKIS_DB_USERNAME:${POSTGRES_USER:akis_app}}
    password: ${AKIS_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${AKIS_DB_POOL_SIZE:5}
      minimum-idle: 1
      initialization-fail-timeout: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  address: ${AKIS_SERVER_ADDRESS:127.0.0.1}
  port: ${AKIS_SERVER_PORT:8080}
  shutdown: graceful

akis:
  execution:
    accept-manual-requests: ${AKIS_EXECUTION_ACCEPT_MANUAL_REQUESTS:false}
    worker-enabled: ${AKIS_EXECUTION_WORKER_ENABLED:false}
    procedure-runtime-enabled: ${AKIS_EXECUTION_PROCEDURE_RUNTIME_ENABLED:false}
  security:
    mode: ${AKIS_SECURITY_MODE:fail-closed}
    development:
      username: ${AKIS_DEV_USERNAME:}
      password: ${AKIS_DEV_PASSWORD:}
    oidc:
      issuer-uri: ${AKIS_OIDC_ISSUER_URI:}
      audience: ${AKIS_OIDC_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
